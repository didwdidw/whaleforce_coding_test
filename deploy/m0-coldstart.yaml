# A8.5 — cold start measured as a k3s workload, which is how production starts.
#
# Two numbers matter and they are not the same one:
#   - scheduled -> browser up -> first page loaded, from inside the container (printed here)
#   - pod created -> container running, from outside (read from the pod's own timestamps)
# A grader waits for both. Run this after the image is already pulled, so the figure is a
# warm-image cold start rather than a one-off registry pull.
apiVersion: v1
kind: Pod
metadata:
  name: m0-coldstart
  labels:
    app: task1-preflight
spec:
  restartPolicy: Never
  containers:
    - name: coldstart
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble
      command:
        - python
        - -c
        - |
          import asyncio, json, time
          from playwright.async_api import async_playwright

          async def main():
              t0 = time.time(); m = {}
              async with async_playwright() as p:
                  b = await p.chromium.launch(args=["--disable-dev-shm-usage"])
                  m["browser_launch_s"] = round(time.time() - t0, 2)
                  pg = await (await b.new_context()).new_page()
                  await pg.goto("https://books.toscrape.com/", wait_until="load", timeout=60000)
                  m["first_page_loaded_s"] = round(time.time() - t0, 2)
                  await b.close()
              m["browser_version"] = b.version
              print(json.dumps(m))

          asyncio.run(main())
