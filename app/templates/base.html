<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Task 1 — Browser Automation Agent{% endblock %}</title>
<style>
:root{
  --ink:#0f141b; --dim:#5d6673; --faint:#8b95a3; --line:#e2e7ee; --bg:#fbfcfd;
  --panel:#fff; --accent:#1d4ed8; --ok:#0f7b4f; --okbg:#e8f6ef;
  --warn:#8a5a00; --warnbg:#fdf5e3; --bad:#a3232b; --badbg:#fdeeee;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e6ebf2;--dim:#9aa4b2;--faint:#6f7a89;--line:#242c38;--bg:#0d1117;
        --panel:#141a22;--accent:#7aa2ff;--ok:#5fd39b;--okbg:#12251d;
        --warn:#e5b95c;--warnbg:#2a2213;--bad:#f08a8a;--badbg:#2b1618}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:22px 20px 80px}
a{color:var(--accent)}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
           flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;
           margin-bottom:22px}
header.top h1{font-size:17px;margin:0;letter-spacing:-.01em}
header.top nav a{margin-left:16px;font-size:13px}
.milestone{background:var(--warnbg);border:1px solid var(--line);color:var(--warn);
           padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
       padding:18px;margin-bottom:18px}
h2{font-size:15px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:13px;margin:20px 0 8px;color:var(--dim);text-transform:uppercase;
   letter-spacing:.06em}
p.sub{color:var(--dim);font-size:13px;margin:0 0 14px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;
       font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.b-dim{background:transparent;color:var(--dim);border-color:var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
      vertical-align:top}
th{color:var(--dim);font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
form.submit input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);
       border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
button{padding:10px 18px;border-radius:8px;border:1px solid var(--accent);
       background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
ul.chips{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px}
ul.chips button{font-size:12.5px;padding:5px 11px}
.trace{list-style:none;padding:0;margin:0}
.trace li{border-left:2px solid var(--line);padding:9px 0 9px 14px;margin-left:6px}
.trace li.bad{border-left-color:var(--bad)}
.trace li.recovery{border-left-color:var(--accent)}
.trace .meta{color:var(--faint);font-size:12px}
details>summary{cursor:pointer;color:var(--dim);font-size:12.5px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;
    overflow-x:auto;font-size:12px;margin:8px 0 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.kv dt{color:var(--dim)} .kv dd{margin:0}
.verified-def{border-left:3px solid var(--accent);padding:10px 14px;background:var(--panel);
              font-size:13px;color:var(--dim);border-radius:0 8px 8px 0}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);
       color:var(--faint);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1><a href="/" style="text-decoration:none;color:inherit">Browser Automation Agent</a>
    <span class="badge b-dim">Task 1</span></h1>
  <nav>
    <a href="/">Runs</a>
    <a href="/support">Support matrix &amp; limitations</a>
    <a href="/healthz">Health</a>
  </nav>
</header>
{% block body %}{% endblock %}
<footer>
  A result is <strong>verified</strong> only when deterministic code re-resolves a stored
  anchor inside the full preserved artifact. <code>partial</code> and
  <code>unverified</code> are never counted as success.
</footer>
</div>
</body>
</html>
